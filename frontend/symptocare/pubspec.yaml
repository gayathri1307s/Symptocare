
  name: symptocare
  description: "A new Flutter project."
  publish_to: 'none'

  version: 1.0.0+1

  environment:
    sdk: ^3.13.5

  dependencies:
    flutter:
      sdk: flutter
    cupertino_icons: ^1.0.9
    file_picker: ^10.3.10
    http: ^1.6.0
    flutter_markdown: ^0.7.7+1
    firebase_core: ^5.0.0
    firebase_auth: ^7.0.0
    cloud_firestore: ^7.0.0

  dev_dependencies:
    flutter_test:
      sdk: flutter
    flutter_lints: ^6.0.0
    flutter_launcher_icons: ^0.14.4

  flutter:
    uses-material-design: true

  flutter_launcher_icons:
      android: true
      ios: true
      image_path: "assets/images/symptocare_app_icon.png"
      min_sdk_android: 21
      adaptive_icon_background: "#FFFFFF"
      adaptive_icon_foreground: "assets/images/symptocare_app_icon.png"
